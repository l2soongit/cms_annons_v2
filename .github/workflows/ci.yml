name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, gd, zip
          coverage: pcov

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Відомі вразливості в залежностях (ТЗ 4, безпека)
      - name: Dependency audit
        run: |
          composer audit --no-interaction
          npm audit --omit=dev --audit-level=high

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests with coverage
        run: php artisan test --coverage-clover=clover.xml

      # Голосування і білінг — гроші й рейтинг, тому покриття не нижче порогу
      - name: Coverage gate (Voting, Billing)
        run: php tests/coverage-gate.php clover.xml app/Voting=80 app/Billing=80
