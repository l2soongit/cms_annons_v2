name: Deploy to hosting

# Запускається вручну з вкладки Actions, поки хостинг не налаштовано.
# Потрібні секрети репозиторію: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Build release
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci
          npm run build

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftps
          # storage/ не виключаємо: у свіжому checkout там лише порожні теки з .gitignore,
          # а Laravel без storage/framework/* на сервері не запуститься. Чужі файли на сервері
          # (логи, кеш, завантаження) дія не чіпає — вона синхронізує лише те, що сама залила.
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            .env
            database/database.sqlite
            tests/**
            phpunit.xml
