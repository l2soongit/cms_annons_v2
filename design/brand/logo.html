<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAJ.CLUB — варіанти логотипа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--night:#0f1b1e;--slab:#172629;--seam:#27393b;--bone:#e7ede6;--moss:#8fa39e;--amber:#f0b43c;--ink:#241a04;--signal:#4fd18b}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--bone);font:15px/1.5 'Golos Text',system-ui,sans-serif;padding:32px 16px}
h1{font:700 26px 'Unbounded',sans-serif;margin:0 0 6px}
.lead{color:var(--moss);margin:0 0 28px}
.grid{display:grid;gap:20px;max-width:1100px}
.card{background:var(--slab);border:1px solid var(--seam);border-radius:16px;padding:22px}
.card h2{font:600 15px 'Unbounded',sans-serif;margin:0 0 4px}
.card p{color:var(--moss);margin:0 0 18px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.stage{border-radius:12px;padding:18px 22px;display:flex;align-items:center;gap:12px}
.dark{background:var(--night)}
.light{background:#eef2f0;color:#13221f}
.word{font:800 21px 'Unbounded',sans-serif;letter-spacing:.01em;text-transform:uppercase}
.word i{font-style:normal;color:var(--amber)}
.light .word i{color:#a86d00}
.sizes{display:flex;gap:14px;align-items:end;margin-left:auto}
.sizes svg{display:block}
.tab{display:flex;align-items:center;gap:6px;background:#202124;color:#ddd;border-radius:8px 8px 0 0;padding:6px 12px;font-size:12px}
</style>
</head>
<body>
<h1>Логотип GRAJ.CLUB</h1>
<p class="lead">5 варіантів. Кожен — значок (для фавікону, аватарок, PWA) + текст у фірмовому шрифті Unbounded. Праворуч значок у розмірах 16, 32 і 64 px.</p>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- A: «Play» — бурштиновий квадрат з кнопкою відтворення -->
    <symbol id="a" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="16" fill="#f0b43c"/>
      <path d="M25 18.5v27a2 2 0 0 0 3 1.7l22-13.5a2 2 0 0 0 0-3.4l-22-13.5a2 2 0 0 0-3 1.7z" fill="#241a04"/>
    </symbol>
    <!-- B: «Рейтинг» — три стовпчики-п'єдестал -->
    <symbol id="b" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="16" fill="#172629"/>
      <rect x="12" y="32" width="11" height="20" rx="3" fill="#8fa39e"/>
      <rect x="26.5" y="14" width="11" height="38" rx="3" fill="#f0b43c"/>
      <rect x="41" y="24" width="11" height="28" rx="3" fill="#4fd18b"/>
    </symbol>
    <!-- C: «G + play» — літера G, всередині кнопка play -->
    <symbol id="c" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="16" fill="#172629"/>
      <path d="M48 20.5A19 19 0 1 0 51 34H35" fill="none" stroke="#f0b43c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M26 24.5v15a1.3 1.3 0 0 0 2 1.1l10.5-7.5a1.3 1.3 0 0 0 0-2.2L28 23.4a1.3 1.3 0 0 0-2 1.1z" fill="#e7ede6"/>
    </symbol>
    <!-- D: «Онлайн» — сервер з зеленим індикатором -->
    <symbol id="d" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="16" fill="#f0b43c"/>
      <rect x="13" y="16" width="38" height="13" rx="4" fill="#241a04"/>
      <rect x="13" y="35" width="38" height="13" rx="4" fill="#241a04"/>
      <circle cx="42" cy="22.5" r="3" fill="#4fd18b"/>
      <circle cx="42" cy="41.5" r="3" fill="#4fd18b"/>
      <rect x="19" y="21" width="12" height="3" rx="1.5" fill="#f0b43c"/>
      <rect x="19" y="40" width="12" height="3" rx="1.5" fill="#f0b43c"/>
    </symbol>
    <!-- E: «Хрестовина» — D-pad геймпада з бурштиновою кнопкою -->
    <symbol id="e" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="32" fill="#172629"/>
      <path d="M26 12h12v14h14v12H38v14H26V38H12V26h14z" fill="#e7ede6"/>
      <circle cx="32" cy="32" r="6" fill="#f0b43c"/>
    </symbol>
  </defs>
</svg>

<div class="grid" id="grid"></div>

<script>
const variants = [
  ['a','A. Play','Бурштиновий квадрат із кнопкою «грати». Найпростіший, найкраще читається в 16 px, продовжує бурштинову крапку з поточного логотипа.'],
  ['b','B. Рейтинг','Три стовпчики-п’єдестал — прямо про те, чим є сайт: рейтинг серверів. Кольори з палітри сайту.'],
  ['c','C. G + play','Велика літера «G» (GRAJ), всередині — кнопка play. Найбільш «авторський» знак.'],
  ['d','D. Сервер онлайн','Дві стійки сервера з зеленими вогниками статусу. Про моніторинг серверів.'],
  ['e','E. Хрестовина','D-pad геймпада з бурштиновою кнопкою посередині. Універсально «ігровий» знак.'],
];
const use = (id,s)=>`<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`;
document.getElementById('grid').innerHTML = variants.map(([id,t,d])=>`
<div class="card"><h2>${t}</h2><p>${d}</p>
 <div class="row">
  <div class="stage dark">${use(id,36)}<span class="word">GRAJ<i>.</i>CLUB</span></div>
  <div class="stage light">${use(id,36)}<span class="word">GRAJ<i>.</i>CLUB</span></div>
  <div class="tab">${use(id,16)} GRAJ.CLUB — рейтинг</div>
  <div class="sizes">${use(id,16)}${use(id,32)}${use(id,64)}</div>
 </div></div>`).join('');
</script>
</body>
</html>
