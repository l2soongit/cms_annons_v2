<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Голос за Oren PvP | graj.club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@700&family=Russo+One&family=Press+Start+2P&family=Stalinist+One&family=Rubik+Dirt&family=Exo+2:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
/*
 * Демо сторінки голосування. Одна мета — проголосувати за 10 секунд: картка сервера, нік для бонусу, капча, кнопка.
 * Після голосу — святкування, +1, нове місце й відлік до наступного голосу (плитки без двокрапок).
 * Стиль гри — як на сторінці сервера (.g-<гра>). Перемикачі внизу — лише для демо.
 */
:root {
  --bg: #09090b; --bg-2: #0f0f12; --card: #18181b; --card-2: #1f1f23; --line: #27272a; --line-2: #3f3f46;
  --text: #f4f4f5; --muted: #a1a1aa; --faint: #71717a; --up: #34d399; --down: #fb7185;
  --display: 'Unbounded', sans-serif; --font: 'Manrope', system-ui, sans-serif; --r: 12px; --r-lg: 16px; --r-xl: 24px;
}
.g-l2   { --gc: #e8b04a; --gc2: #7a3e0b; --gink: #1c1003; --gfont: 'Cormorant', serif; --gtrack: .06em; --gcase: uppercase; --gshadow: 0 0 24px #e8b04a66; --gsize: 1.1; }
.g-gta  { --gc: #ff4fa3; --gc2: #6d28d9; --gink: #1a0414; --gfont: 'Russo One', sans-serif; --gtrack: 0; --gcase: none; --gshadow: 3px 3px 0 #6d28d9; --gsize: 1; }
.g-mc   { --gc: #6cc644; --gc2: #8b5a2b; --gink: #0f1f08; --gfont: 'Press Start 2P', monospace; --gtrack: 0; --gcase: none; --gshadow: 3px 3px 0 #1f3d0f; --gsize: .6; }
.g-dayz { --gc: #b8c48a; --gc2: #2f3a22; --gink: #12160c; --gfont: 'Stalinist One', sans-serif; --gtrack: .02em; --gcase: uppercase; --gshadow: 0 2px 0 #0008; --gsize: .75; }
.g-rust { --gc: #e2652f; --gc2: #5a2412; --gink: #1f0b03; --gfont: 'Rubik Dirt', sans-serif; --gtrack: .01em; --gcase: uppercase; --gshadow: 0 0 18px #e2652f66; --gsize: 1; }
.g-cs   { --gc: #4fc3f7; --gc2: #0b2a4a; --gink: #04121d; --gfont: 'Exo 2', sans-serif; --gtrack: .02em; --gcase: uppercase; --gshadow: 0 0 18px #4fc3f788; --gsize: 1; }
body { --grad: linear-gradient(90deg, color-mix(in srgb, var(--gc) 70%, #fff), var(--gc) 50%, color-mix(in srgb, var(--gc) 60%, var(--gc2))); }
.gtitle { font-family: var(--gfont); letter-spacing: var(--gtrack); text-transform: var(--gcase); text-shadow: var(--gshadow); }
.g-cs .gtitle { font-style: italic; }

* { box-sizing: border-box; margin: 0; }
html, body { overflow-x: clip; }
body { min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gc); outline-offset: 3px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.glow-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(700px 420px at 50% -10%, color-mix(in srgb, var(--gc) 26%, transparent), transparent 65%), radial-gradient(600px 400px at 0% 100%, color-mix(in srgb, var(--gc2) 32%, transparent), transparent 60%); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: var(--r); font-weight: 800; font-size: 15px; cursor: pointer; border: 1px solid transparent; white-space: nowrap; position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s, border-color .2s, opacity .2s; }
.btn-g { background: var(--grad); color: var(--gink); box-shadow: 0 10px 34px -12px var(--gc); }
.btn-g::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, #ffffff8c 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s ease; }
.btn-g:hover::after { transform: translateX(120%); }
.btn-g:hover { transform: translateY(-1px); }
.btn-ghost { border-color: var(--line-2); background: #ffffff06; }
.btn-ghost:hover { border-color: var(--gc); }
.btn-xl { width: 100%; padding: 18px 22px; font-size: 18px; border-radius: var(--r-lg); }

header { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; }
.logo { display: flex; align-items: center; gap: 12px; font: 700 17px var(--display); }
.logo i { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(90deg, #fbbf24, #f97316); display: grid; place-items: center; }
.back { font-size: 14px; color: var(--muted); }
.back:hover { color: var(--text); }

main { padding: 12px 16px 120px; display: grid; justify-items: center; gap: 24px; }
.vcard { position: relative; width: min(520px, 100%); border-radius: var(--r-xl); background: var(--card); border: 1px solid color-mix(in srgb, var(--gc) 30%, var(--line)); box-shadow: 0 40px 90px -50px var(--gc); overflow: hidden; animation: card-in .6s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes card-in { from { opacity: 0; transform: translateY(20px) scale(.98); } }
/* Шапка картки: сервер на фоні його кольорів */
.vhead { position: relative; isolation: isolate; padding: 22px; display: flex; gap: 16px; align-items: center; background: linear-gradient(120deg, color-mix(in srgb, var(--gc2) 70%, #000), color-mix(in srgb, var(--gc) 30%, #111)); }
.vhead::after { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 85% 0%, color-mix(in srgb, var(--gc) 45%, transparent), transparent 55%); }
.slogo { flex: none; width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; font: 800 28px var(--display); color: var(--gink); background: var(--grad); box-shadow: 0 10px 30px -10px var(--gc), inset 0 0 0 1px #ffffff40; }
.vhead h1 { font-size: calc(26px * var(--gsize)); line-height: 1.1; }
.vhead .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; background: #00000055; border: 1px solid #ffffff22; }
.pill.on { color: var(--up); }
.pill.on::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
.vbody { padding: 22px; }
.lead { color: var(--muted); font-size: 15px; }
/* Прогрес у рейтингу: скільки до наступного місця */
.race { margin-top: 16px; padding: 14px; border-radius: var(--r); background: var(--bg-2); border: 1px solid var(--line); }
.race .l { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.race .l b { color: var(--text); }
.race .track { position: relative; margin-top: 8px; height: 8px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.race .track i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--grad); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
form { margin-top: 18px; display: grid; gap: 14px; }
.field label { display: block; font-weight: 800; font-size: 14px; }
.input { margin-top: 6px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: var(--r); background: var(--bg); border: 1px solid var(--line-2); transition: border-color .2s, box-shadow .2s; }
.input:focus-within { border-color: var(--gc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gc) 18%, transparent); }
.input svg { color: var(--faint); flex: none; }
.input input { flex: 1; min-width: 0; padding: 13px 0; background: none; border: 0; font-size: 16px; }
.input input:focus { outline: none; }
.field small { display: block; margin-top: 6px; color: var(--faint); font-size: 12px; }
/* Місце капчі (Turnstile) */
.captcha { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--bg-2); border: 1px solid var(--line); font-size: 14px; }
.captcha .box { width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--line-2); display: grid; place-items: center; transition: all .25s; }
.captcha.ok .box { border-color: var(--up); background: var(--up); color: #062; }
.captcha .brand { margin-left: auto; font-size: 11px; color: var(--faint); }
.btn-xl.pulse { animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: translateY(-1px); box-shadow: 0 16px 44px -12px var(--gc); } }
.btn-xl .spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.small-print { text-align: center; font-size: 12px; color: var(--faint); }
.alert { padding: 12px 14px; border-radius: var(--r); border: 1px solid #fb718566; background: #fb71851a; font-size: 14px; animation: shake .4s; }
.alert b { display: block; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* Стан «Дякуємо»: галочка малюється, +1, конфеті в кольорах гри */
.done { text-align: center; }
.check { width: 96px; height: 96px; margin: 4px auto 0; }
.check circle { fill: none; stroke: var(--gc); stroke-width: 5; stroke-dasharray: 280; stroke-dashoffset: 280; animation: draw .7s ease forwards; }
.check path { fill: none; stroke: var(--gc); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .45s ease .55s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.done h2 { margin-top: 12px; font: 800 26px var(--display); letter-spacing: -0.02em; }
.done .sub { margin-top: 6px; color: var(--muted); }
.plus { position: absolute; left: 50%; top: 150px; font: 800 34px var(--display); color: var(--up); pointer-events: none; animation: plus 1.4s ease-out forwards; }
@keyframes plus { from { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } to { opacity: 0; transform: translate(-50%, -70px); } }
.result { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.result div { padding: 14px; border-radius: var(--r); background: var(--bg-2); border: 1px solid var(--line); }
.result small { display: block; color: var(--muted); font-size: 12px; }
.result b { display: block; margin-top: 2px; font: 800 26px var(--display); }
.reward { margin-top: 12px; display: flex; align-items: center; gap: 10px; justify-content: center; padding: 10px 12px; border-radius: var(--r); background: #34d39914; border: 1px solid #34d39944; color: #a7f3d0; font-size: 14px; }
.reward svg { flex: none; color: var(--up); }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: 120px; left: 50%; width: 8px; height: 12px; border-radius: 2px; background: var(--c); opacity: 0; animation: conf 1.6s cubic-bezier(.2,.7,.4,1) forwards; animation-delay: var(--d); }
@keyframes conf { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }

/* Відлік до наступного голосу: нейтральні плитки, кольорові лише цифри, без двокрапок */
.next { margin-top: 18px; }
.next p { font-size: 13px; color: var(--muted); text-align: center; }
.cd { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.cd .tile { position: relative; height: 56px; border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, #ffffff0c, #ffffff04 50%, #00000040); border: 1px solid #ffffff12; box-shadow: inset 0 1px 0 #ffffff10; }
.cd .val { position: absolute; inset: 0; display: grid; place-items: center; font: 700 26px var(--display); color: var(--gc); font-variant-numeric: tabular-nums; }
.cd .val.in { animation: roll-in .45s cubic-bezier(.2,.9,.3,1) both; }
.cd .val.out { animation: roll-out .45s cubic-bezier(.4,0,.6,1) both; }
@keyframes roll-in { from { transform: translateY(70%); opacity: 0; } }
@keyframes roll-out { to { transform: translateY(-70%); opacity: 0; } }
.cd .lbl { display: block; margin-top: 4px; text-align: center; font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.after { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.after .btn { width: 100%; }
.after .wide { grid-column: 1 / -1; }

/* Стан «Вже голосували» */
.waiting { text-align: center; }
.clock { width: 72px; height: 72px; margin: 4px auto 0; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--gc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--gc) 40%, transparent); color: var(--gc); }
.clock svg .hand { transform-origin: 12px 12px; animation: hand 4s linear infinite; }
@keyframes hand { to { transform: rotate(360deg); } }
.waiting h2 { margin-top: 12px; font: 800 22px var(--display); }
.waiting .sub { margin-top: 6px; color: var(--muted); }

.ad { width: min(520px, 100%); display: grid; place-items: center; height: 250px; border-radius: var(--r-lg); border: 1px dashed var(--line-2); color: var(--faint); font-size: 13px; text-align: center; }
.ad small { display: block; font-size: 11px; }

.demo-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50; display: grid; gap: 4px; padding: 6px; border-radius: 16px; background: #000c; border: 1px solid var(--line-2); width: max-content; max-width: calc(100% - 24px); }
.demo-bar div { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.demo-bar span { padding: 4px 8px; font-size: 12px; color: var(--faint); }
.demo-bar button { border: 0; background: none; color: var(--muted); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; }
.demo-bar button[aria-pressed="true"] { background: var(--grad); color: var(--gink); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .check circle, .check path { stroke-dashoffset: 0; } }
/* Легкий режим для телефонів: без постійної пульсації; конфеті лишається короткою одноразовою */
@media (max-width: 768px), (hover: none) and (pointer: coarse) { .btn-xl.pulse, .clock svg .hand { animation: none; } }
@media (max-width: 480px) { header { padding: 14px 16px; } .vhead { padding: 18px; } .vbody { padding: 18px; } .slogo { width: 54px; height: 54px; font-size: 24px; } }
</style>
</head>
<body class="g-l2">
<div class="glow-bg" aria-hidden="true"></div>

<header>
  <a class="logo" href="#"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="#1c1003" aria-hidden="true"><path d="M7 3h10v3h4v3a5 5 0 0 1-5 5h-.3A5 5 0 0 1 13 16.9V19h3v2H8v-2h3v-2.1A5 5 0 0 1 8.3 14H8a5 5 0 0 1-5-5V6h4z"/></svg></i>graj.club</a>
  <a class="back" href="server.html">← До сторінки сервера</a>
</header>

<main>
  <section class="vcard" id="card" aria-live="polite">
    <div class="vhead">
      <span class="slogo" id="letter" aria-hidden="true">O</span>
      <div style="min-width:0">
        <h1 class="gtitle" id="sname">Oren PvP</h1>
        <div class="meta"><span class="pill">🏆 <span id="rank">#1</span> у <span id="game">Lineage 2</span></span><span class="pill on"><span class="num" id="online">1 104</span> онлайн</span></div>
      </div>
    </div>
    <div class="vbody" id="body"></div>
  </section>
  <div class="ad">Місце для банера 300 × 250<small>Реклама під формою — спершу голос</small></div>
</main>

<!-- Лише для демо: стан сторінки й стиль гри -->
<div class="demo-bar">
  <div role="group" aria-label="Стан (демо)" id="states"><span>Стан:</span><button data-s="form" aria-pressed="true">Форма</button><button data-s="done" aria-pressed="false">Дякуємо</button><button data-s="wait" aria-pressed="false">Вже голосував</button><button data-s="error" aria-pressed="false">Помилка</button></div>
  <div role="group" aria-label="Гра (демо)" id="themes"><span>Гра:</span><button data-g="l2" aria-pressed="true">L2</button><button data-g="gta" aria-pressed="false">GTA</button><button data-g="mc" aria-pressed="false">MC</button><button data-g="dayz" aria-pressed="false">DayZ</button><button data-g="rust" aria-pressed="false">Rust</button><button data-g="cs" aria-pressed="false">CS</button></div>
</div>

<script>
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lite = matchMedia('(max-width: 768px), (hover: none) and (pointer: coarse)').matches;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const fmt = n => Math.round(n).toLocaleString('uk-UA');

const DEMO = {
  l2: ['Oren PvP', 'Lineage 2', 1, 1104, 583, 37], gta: ['Kyiv RP', 'GTA', 1, 1820, 612, 68], mc: ['Карпати SMP', 'Minecraft', 2, 342, 598, 14],
  dayz: ['Polissia Zone', 'DayZ', 2, 58, 571, 9], rust: ['Wild Coast x2', 'Rust', 3, 260, 548, 23], cs: ['Kyiv Retake 128', 'Counter-Strike', 1, 18, 612, 46],
};
let g = 'l2', state = 'form';
const d = () => DEMO[g];
const svgUser = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
const up = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';

// Відлік до наступного голосу (24 год від «зараз»)
const nextAt = Date.now() + 24 * 3600e3 - 5000;
const countdown = () => `<div class="next"><p>Наступний голос за цей сервер через</p><div class="cd" role="timer" id="cd">${[['h', 'годин'], ['m', 'хвилин'], ['s', 'секунд']].map(([u, l]) => `<div><div class="tile" data-u="${u}"><span class="val">00</span></div><span class="lbl">${l}</span></div>`).join('')}</div></div>`;
const setDigit = (tile, text) => {
  const cur = tile.querySelector('.val:not(.out)');
  if (!cur || cur.textContent === text) return;
  if (calm) { cur.textContent = text; return; }
  cur.classList.add('out'); setTimeout(() => cur.remove(), 450);
  const next = document.createElement('span'); next.className = 'val in'; next.textContent = text; tile.append(next);
};
setInterval(() => {
  const cd = $('#cd'); if (!cd) return;
  const s = Math.max(0, (nextAt - Date.now()) / 1000);
  const v = { h: Math.floor(s / 3600), m: Math.floor(s % 3600 / 60), s: Math.floor(s % 60) };
  $$('.tile', cd).forEach(t => setDigit(t, String(v[t.dataset.u]).padStart(2, '0')));
}, 1000);

const countUp = (el, from, to, ms = 900) => {
  if (calm) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / ms); el.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
};

const VIEWS = {
  form: () => `
    <p class="lead">Голос можна віддати раз на 24 години. Він піднімає сервер у рейтингу місяця, а сервер може видати вам бонус у грі.</p>
    <div class="race"><div class="l"><span>${d()[2] === 1 ? 'Відрив від 2-го місця' : `До ${d()[2] - 1}-го місця`}</span><b class="num">${d()[5]} голосів</b></div><div class="track"><i id="race" data-w="${d()[2] === 1 ? 92 : 76}"></i></div></div>
    <form id="form" novalidate>
      <div class="field"><label for="nick">Нік у грі</label>
        <div class="input">${svgUser}<input id="nick" maxlength="32" autocomplete="off" placeholder="Наприклад, Taras_UA"></div>
        <small>Необов’язково. Якщо вказати, сервер нарахує бонус саме вашому персонажу.</small></div>
      <button type="button" class="captcha" id="captcha" aria-pressed="false"><span class="box" aria-hidden="true"></span>Підтвердіть, що ви людина<span class="brand">Cloudflare Turnstile</span></button>
      <button class="btn btn-g btn-xl ${lite ? '' : 'pulse'}" id="go" type="submit">${up}Віддати голос</button>
      <p class="small-print">Один голос з пристрою й мережі на добу · без реєстрації</p>
    </form>`,
  done: () => {
    const nick = $('#nick')?.value.trim() || 'Taras_UA';
    return `<div class="done">
      <svg class="check" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44"/><path d="M30 52 L45 66 L71 37"/></svg>
      <h2>Голос зараховано!</h2>
      <p class="sub">Дякуємо — ви допомагаєте ${d()[0]} ${d()[2] === 1 ? 'втримати перше місце' : 'піднятися в рейтингу'}.</p>
      <div class="result"><div><small>Голосів цього місяця</small><b class="num grad" id="newvotes">${fmt(d()[4])}</b></div><div><small>Місце в рейтингу</small><b class="num">#${d()[2]}</b></div></div>
      <div class="reward">${'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7"/></svg>'}Бонус надіслано на сервер для <b>${nick.replace(/[<>&"]/g, '')}</b></div>
      ${countdown()}
      <div class="after"><a class="btn btn-ghost" href="server.html">До сервера</a><button class="btn btn-ghost" type="button" id="share">Поділитися</button><a class="btn btn-g wide" href="#">Інші сервери ${d()[1]}</a></div>
    </div>`;
  },
  wait: () => `<div class="waiting">
      <div class="clock"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path class="hand" d="M12 12V6"/><path d="M12 12h4"/></svg></div>
      <h2>Ви вже голосували сьогодні</h2>
      <p class="sub">За ${d()[0]} можна голосувати раз на 24 години. Збережіть сторінку — повертайтесь завтра.</p>
      ${countdown()}
      <div class="after"><a class="btn btn-ghost" href="server.html">До сервера</a><a class="btn btn-g" href="#">Інші сервери</a></div>
    </div>`,
  error: () => VIEWS.form().replace('<form id="form" novalidate>', '<form id="form" novalidate><div class="alert" role="alert"><b>Голос не зараховано</b>З вашої мережі сьогодні вже проголосувало забагато людей. Спробуйте з мобільного інтернету або завтра.</div>'),
};

// Конфеті в кольорах гри — одноразово; на телефоні менше частинок
const confetti = () => {
  if (calm) return;
  const cs = getComputedStyle(document.body);
  const colors = [cs.getPropertyValue('--gc'), '#ffffff', '#34d399', cs.getPropertyValue('--gc2')];
  const box = document.createElement('div'); box.className = 'confetti';
  box.innerHTML = Array.from({ length: lite ? 18 : 40 }, (_, i) => {
    const a = Math.random() * Math.PI - Math.PI, r = 120 + Math.random() * 180;
    return `<i style="--c:${colors[i % 4]};--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r + 160}px;--r:${Math.random() * 720 - 360}deg;--d:${Math.random() * .15}s"></i>`;
  }).join('');
  $('#card').append(box); setTimeout(() => box.remove(), 1900);
  const plus = document.createElement('span'); plus.className = 'plus'; plus.textContent = '+1'; $('#card').append(plus); setTimeout(() => plus.remove(), 1500);
};

const render = s => {
  state = s;
  $('#body').innerHTML = VIEWS[s]();
  $$('#states button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === s)));
  requestAnimationFrame(() => requestAnimationFrame(() => { const r = $('#race'); if (r) r.style.width = r.dataset.w + '%'; }));
  if (s === 'done') { confetti(); countUp($('#newvotes'), d()[4], d()[4] + 1); }
  bindForm();
};

const bindForm = () => {
  const cap = $('#captcha');
  if (cap) cap.onclick = () => { cap.classList.add('ok'); cap.setAttribute('aria-pressed', 'true'); $('.box', cap).textContent = '✓'; cap.firstChild.nextSibling.textContent = 'Перевірку пройдено'; };
  const form = $('#form');
  if (form) form.onsubmit = e => {
    e.preventDefault();
    if (!cap.classList.contains('ok')) { cap.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 300 }); return; }
    const go = $('#go'); go.disabled = true; go.classList.remove('pulse'); go.innerHTML = '<span class="spin" aria-hidden="true"></span>Зараховуємо…';
    setTimeout(() => render('done'), 900);
  };
  const share = $('#share');
  if (share) share.onclick = async () => { try { await navigator.clipboard.writeText(location.href.replace('vote.html', 'server.html')); } catch (e) {} share.textContent = 'Посилання скопійовано ✓'; };
};

const applyTheme = t => {
  g = t;
  document.body.className = 'g-' + t;
  const [name, game, rank, online] = d();
  $('#sname').textContent = name; $('#letter').textContent = name[0]; $('#rank').textContent = '#' + rank; $('#game').textContent = game; $('#online').textContent = fmt(online);
  document.title = `Голос за ${name} | graj.club`;
  $$('#themes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === t)));
  render(state);
};
$$('#states button').forEach(b => b.addEventListener('click', () => render(b.dataset.s)));
$$('#themes button').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.g)));
render('form');
</script>
</body>
</html>
